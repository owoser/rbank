on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v0.1.0-beta.1'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/cache@v6
        with:
          path: .tools
          key: rbank-tools-${{ hashFiles('scripts/tool-environment.ps1', 'scripts/prepare-tools.ps1') }}
          restore-keys: |
            rbank-tools-

      - uses: actions/cache@v6
        with:
          path: build/deps
          key: rbank-deps-${{ hashFiles('scripts/dependencies.lock.json') }}-${{ runner.os }}
          restore-keys: |
            rbank-deps-

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+') { throw "Not a release tag: $tag" }
          $version = $tag -replace '^v', ''
          $prerelease = if ($version -match '-') { 'true' } else { 'false' }
          "RBANK_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RBANK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RBANK_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare dependencies
        shell: pwsh
        run: ./scripts/prepare-deps.ps1

      - name: Test
        shell: pwsh
        run: ./scripts/test-local.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build-local.ps1

      - name: Package
        shell: pwsh
        run: |
          $manifestPath = 'build/rbank/manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.version = $env:RBANK_VERSION
          [IO.File]::WriteAllText($manifestPath, (ConvertTo-Json -InputObject $manifest -Depth 5))
          Remove-Item -LiteralPath rbank-windows-x64.zip -ErrorAction SilentlyContinue
          Compress-Archive -LiteralPath build/rbank -DestinationPath rbank-windows-x64.zip -Force

      - name: Extract release notes
        id: notes
        uses: ffurrer2/extract-release-notes@v3
        with:
          changelog_file: CHANGELOG.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RBANK_TAG }}
          name: ${{ env.RBANK_TAG }}
          prerelease: ${{ env.RBANK_PRERELEASE == 'true' }}
          body: ${{ steps.notes.outputs.release_notes }}
          files: rbank-windows-x64.zip
          fail_on_unmatched_files: true
