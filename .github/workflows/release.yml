on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .tools
          key: rbank-tools-${{ hashFiles('scripts/tool-environment.ps1', 'scripts/prepare-tools.ps1') }}
          restore-keys: |
            rbank-tools-

      - uses: actions/cache@v6
        with:
          path: build/deps
          key: rbank-deps-${{ hashFiles('scripts/dependencies.lock.json') }}-${{ runner.os }}
          restore-keys: |
            rbank-deps-

      - name: Prepare dependencies
        shell: pwsh
        run: ./scripts/prepare-deps.ps1

      - name: Test
        shell: pwsh
        run: ./scripts/test-local.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build-local.ps1

      - name: Stage package
        shell: pwsh
        run: |
          $stage = 'build/package/rbank'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Path build/rbank/* -Destination $stage -Recurse -Force
          $version = '${{ github.event.release.tag_name }}' -replace '^v', ''
          $manifest = Get-Content -LiteralPath (Join-Path $stage 'manifest.json') -Raw | ConvertFrom-Json
          $manifest.version = $version
          [IO.File]::WriteAllText((Join-Path $stage 'manifest.json'), (ConvertTo-Json -InputObject $manifest -Depth 5))
          Copy-Item CHANGELOG.md, LICENSE, README.md -Destination (Join-Path $stage '..') -Force

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path build/package/* -DestinationPath rbank-windows-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: rbank-windows-x64
          path: rbank-windows-x64.zip
          if-no-files-found: error

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: notes
        uses: ffurrer2/extract-release-notes@v3
        with:
          changelog_file: CHANGELOG.md

      - uses: actions/download-artifact@v8
        with:
          name: rbank-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.notes.outputs.release_notes }}
          files: |
            dist/rbank-windows-x64.zip
